<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>手机版排版预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#262626;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18px 16px 30px;gap:14px}header{display:flex;align-items:center;gap:16px;font-size:13px;color:#bbb}select{background:#333;color:#eee;border:1px solid #555;border-radius:6px;padding:6px}iframe{display:block;width:390px;height:844px;border:0;background:#181818;border-radius:24px;box-shadow:0 0 0 7px #111,0 12px 36px #0006;flex-shrink:0}p{margin:0;font-size:12px;color:#999}
</style></head><body>
<header><span>手机竖屏预览</span><select aria-label="屏幕尺寸"><option value="390,844">390 × 844</option><option value="375,667">375 × 667</option><option value="430,932">430 × 932</option></select></header>
<p>在手机画面内滑动，可使用导航检查各页排版</p>
<div id="device"><iframe src="index.html#work" title="手机尺寸作品集预览"></iframe></div>
<script>function fit(){const frame=document.querySelector('iframe');const w=parseInt(frame.style.width)||390;const h=parseInt(frame.style.height)||844;const scale=Math.min(1,(innerHeight-110)/h,(innerWidth-40)/w);frame.style.transform='scale('+scale+')';frame.style.transformOrigin='top left';document.querySelector('#device').style.cssText='width:'+w*scale+'px;height:'+h*scale+'px';}addEventListener('resize',fit);fit();document.querySelector('select').addEventListener('change',event=>{const [w,h]=event.target.value.split(',');const frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';fit();});</script>
</body></html>
